<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Native-app feel: lock zoom so the page never pinches, double-taps or
         reflows like a plain browser page. viewport-fit=cover keeps notched-
         device safe areas working in the standalone PWA. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- SEO Meta Tags -->
    <title>JDLX MOBILE | Premium Mobile & Tech Accessories</title>
    <meta name="description" content="JDLX Mobile - Premium mobile accessories online. Screen protectors, cases, chargers and more. Fast delivery across India." />
    <meta name="keywords" content="JDLX, Mobile Accessories, Premium, Tech Stickers, Screen Protectors, India" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jdlxmobile.in/" />

    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://jdlxmobile.in/" />
    <meta property="twitter:title" content="JDLX MOBILE | Premium Tech Delivered Fast" />
    <meta property="twitter:description" content="JDLX Mobile - Premium mobile accessories online. Screen protectors, cases, chargers and more. Fast delivery across India." />
    <meta property="twitter:image" content="https://jdlxmobile.in/twitter-image.jpg" />
    <meta name="apple-mobile-web-app-title" content="JDLX Mobile" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
