name: jdlx-infra

services:
  backend1:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: jdlx-backend-1
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment before starting}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - INITIAL_SUPER_ADMIN_EMAIL=${INITIAL_SUPER_ADMIN_EMAIL:-}
    expose:
      - "5000"
    volumes:
      - ../backend/jdlx.db:/app/jdlx.db
      - ../backend/static/uploads:/app/static/uploads
      - ../backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend2:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: jdlx-backend-2
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment before starting}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - INITIAL_SUPER_ADMIN_EMAIL=${INITIAL_SUPER_ADMIN_EMAIL:-}
    expose:
      - "5000"
    volumes:
      - ../backend/jdlx.db:/app/jdlx.db
      - ../backend/static/uploads:/app/static/uploads
      - ../backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend3:
    build:
      context: ..
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: jdlx-backend-3
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment before starting}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - INITIAL_SUPER_ADMIN_EMAIL=${INITIAL_SUPER_ADMIN_EMAIL:-}
    expose:
      - "5000"
    volumes:
      - ../backend/jdlx.db:/app/jdlx.db
      - ../backend/static/uploads:/app/static/uploads
      - ../backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: jdlx-nginx-lb
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../backend/static:/var/www/static:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: jdlx-nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx
    expose:
      - "9113"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: jdlx-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: jdlx-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: jdlx-blackbox-exporter
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    expose:
      - "9115"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: jdlx-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: jdlx-prometheus
    depends_on:
      - nginx
      - nginx-exporter
      - cadvisor
      - node-exporter
      - blackbox-exporter
      - alertmanager
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    container_name: jdlx-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
