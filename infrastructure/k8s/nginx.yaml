apiVersion: v1
kind: ConfigMap
metadata:
  name: jdlx-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;

      upstream backend_service {
        server jdlx-backend:5000;
        keepalive 64;
      }

      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
          proxy_pass http://backend_service;
        }

        location / {
          try_files $uri /index.html;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdlx-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jdlx-nginx
  template:
    metadata:
      labels:
        app: jdlx-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: jdlx-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: jdlx-nginx
spec:
  type: LoadBalancer
  selector:
    app: jdlx-nginx
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

