apiVersion: apps/v1
kind: Deployment
metadata:
  name: jdlx-backend
  labels:
    app: jdlx-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jdlx-backend
  template:
    metadata:
      labels:
        app: jdlx-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/api/health"
    spec:
      containers:
        - name: backend
          image: jdlx/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jdlx-secrets
                  key: jwt_secret
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jdlx-secrets
                  key: google_client_id
                  optional: true
            - name: INITIAL_SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: jdlx-secrets
                  key: initial_super_admin_email
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jdlx-backend
  labels:
    app: jdlx-backend
spec:
  selector:
    app: jdlx-backend
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000

