worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    # Round-robin upstream pool (default NGINX behavior).
    upstream backend_servers {
        zone backend_servers 64k;
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # NGINX metrics endpoint (for nginx-prometheus-exporter)
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # Serve frontend static build efficiently
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # Product/images static files from backend shared static volume
        location /uploads/ {
            alias /var/www/static/uploads/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # Reverse proxy to Flask backend instances
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Passive health checks + failover
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_pass http://backend_servers;
        }

        # SPA fallback
        location / {
            try_files $uri /index.html;
        }
    }
}
